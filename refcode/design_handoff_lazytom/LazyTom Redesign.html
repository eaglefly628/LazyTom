<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LazyTom — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #1A1A18; font-family: 'Geist', -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button:focus { outline: none; }
  input:focus { outline: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(31,42,33,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screen-timer.jsx"></script>
<script type="text/babel" src="screen-points.jsx"></script>
<script type="text/babel" src="screen-tasks.jsx"></script>
<script type="text/babel" src="screen-settings.jsx"></script>

<script type="text/babel">
const W = 400, H = 740;

function App() {
  return (
    <DesignCanvas title="LazyTom — Redesign" subtitle="Warm cream · Deep moss · Instrument Serif">
      <DCSection id="screens" title="The four screens, reimagined">
        <DCArtboard id="timer" label="01 · Timer" width={W} height={H}>
          <LTFrame width={W} height={H}>
            <ScreenTimer />
            <LTTabBar active="timer" />
          </LTFrame>
        </DCArtboard>
        <DCArtboard id="points" label="02 · Points" width={W} height={H}>
          <LTFrame width={W} height={H}>
            <ScreenPoints />
            <LTTabBar active="points" />
          </LTFrame>
        </DCArtboard>
        <DCArtboard id="tasks" label="03 · Tasks" width={W} height={H}>
          <LTFrame width={W} height={H}>
            <ScreenTasks />
            <LTTabBar active="tasks" />
          </LTFrame>
        </DCArtboard>
        <DCArtboard id="settings" label="04 · Settings" width={W} height={H}>
          <LTFrame width={W} height={H}>
            <ScreenSettings />
            <LTTabBar active="settings" />
          </LTFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
